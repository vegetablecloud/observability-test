# =============================================================================
#  Telemetry-demo: en AI-applikation + en komplett OpenTelemetry/Grafana-stack
#
#  APPLIKATION (teamen äger koden – de PUSHAR OTLP till Collectorn)
#    frontend (C#, UI) → backend (C#, affärslogik) → ai-chat (Python, LangGraph-agent)
#                                  └→ postgres            ├─ verktyg → rag-api (Python) → vllm-embed · paradedb
#                                                         ├─ verktyg → algorithm (Python, förberäknat) → postgres
#                                                         └─ LLM     → vllm-gemma
#
#  TREDJEPART (du äger inte koden – DU HÄMTAR (pull) deras /metrics och statistik)
#    vllm-gemma, vllm-embed (vLLM /metrics) · postgres, paradedb (SQL-statistik)
#
#  INFRA (pull av Prometheus)      node-exporter · cadvisor · dcgm-exporter
#  OBSERVABILITY                   otel-collector → loki · tempo · prometheus → grafana
#
#  Start:  docker compose up -d --build     UI: http://localhost:8080
#          Grafana: http://localhost:3000   (anonym admin, inget lösenord)
# =============================================================================
name: telemetry-demo

# Samma OTel-konfiguration för alla instrumenterade tjänster. Det här är
# "kontraktet" du ger andra team: endpoint + resource-attribut. Resten är deras SDK.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=demo,host.name=dgx-spark
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_METRICS_EXEMPLAR_FILTER: trace_based

# .NET: styr loggnivå vid källan – ramverkets INFO-loggar per HTTP-anrop är mest brus.
x-dotnet-logging: &dotnet-logging
  Logging__LogLevel__Default: Information
  Logging__LogLevel__Microsoft.AspNetCore: Warning
  Logging__LogLevel__System.Net.Http: Warning

x-otel-python: &otel-python
  <<: *otel-env
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_SEMCONV_STABILITY_OPT_IN: http          # stabila HTTP-metricnamn, samma som .NET
  OTEL_PYTHON_FASTAPI_EXCLUDE_SPANS: receive,send   # ta bort ASGI-interna mini-spans (brus)

x-py-health: &py-health
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
  interval: 10s
  timeout: 3s
  retries: 12

services:
  # ------------------------------------------------------------------ APP ----
  frontend:
    build: ./services/frontend
    ports: ["8080:8080"]
    environment:
      <<: [*otel-env, *dotnet-logging]
      OTEL_SERVICE_NAME: frontend
      BACKEND_URL: http://backend:8080
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
    depends_on: [backend, otel-collector]

  backend:
    build: ./services/backend
    environment:
      <<: [*otel-env, *dotnet-logging]
      OTEL_SERVICE_NAME: backend
      AI_CHAT_URL: http://ai-chat:8080
      POSTGRES_CONNECTION: Host=postgres;Username=demo;Password=demo;Database=demo
      BAD_CARDINALITY: ${BAD_CARDINALITY:-false}
    depends_on: [postgres, ai-chat, otel-collector]

  ai-chat:                     # LangGraph-agenten
    build: ./services/ai-chat
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: ai-chat
      LLM_BASE_URL: http://vllm-gemma:8000/v1
      LLM_MODEL: gemma
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-2.5}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      RAG_API_URL: http://rag-api:8080
      ALGORITHM_URL: http://algorithm:8080
      # prompter, svar och verktygsargument på spans (klipps vid 2000 tecken, e-post redigeras i Collectorn)
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${CAPTURE_CONTENT:-true}
    healthcheck: *py-health
    depends_on: [rag-api, algorithm, otel-collector]

  rag-api:                     # retrieval: embeddings + hybrid-sökning
    build: ./services/rag-api
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: rag-api
      RAG_DB_DSN: postgresql://demo:demo@paradedb:5432/rag
      EMBED_BASE_URL: http://vllm-embed:8000/v1
      EMBED_MODEL: harrier
    healthcheck: *py-health
    depends_on: [paradedb, otel-collector]

  algorithm:                   # förberäknar tunga resultat i bakgrunden
    build: ./services/algorithm
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: algorithm
      APP_DB_DSN: postgresql://demo:demo@postgres:5432/demo
      PRECOMPUTE_INTERVAL_S: "20"
    healthcheck: *py-health
    depends_on: [postgres, otel-collector]

  loadgen:
    build: ./services/loadgen
    environment:
      TARGET_URL: http://frontend:8080
      RPS: ${RPS:-2}
    depends_on: [frontend]

  # ----------------------------------------------------- TREDJEPART / DATA ---
  # Profil "sim" (default): mockar av vLLM + simulerad dcgm-exporter, ingen GPU krävs.
  vllm-gemma:
    profiles: [sim]
    build: ./services/llm-mock
    environment:
      MODEL_NAME: gemma
      MODEL_KIND: chat
      SIMULATE_GPU: "true"
    networks:
      default:
        aliases: [dcgm-exporter]   # Prometheus skrapar "dcgm-exporter:9400" oavsett profil

  vllm-embed:
    profiles: [sim]
    build: ./services/llm-mock
    environment:
      MODEL_NAME: harrier
      MODEL_KIND: embedding

  # Profil "gpu" (på DGX Spark): riktig vLLM för båda modellerna + riktig dcgm-exporter.
  #   COMPOSE_PROFILES=gpu docker compose up -d
  vllm-gemma-gpu:
    profiles: [gpu]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    entrypoint: ["vllm", "serve"]
    command:
      - ${VLLM_CHAT_MODEL:-google/gemma-3-4b-it}
      - --served-model-name=gemma
      - --port=8000
      - --gpu-memory-utilization=${VLLM_GPU_MEM:-0.45}
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_TOOL_PARSER:-pythonic}
      # vLLM kan själv PUSHA traces via OTLP – då syns även spans inne i LLM-servern
      - --otlp-traces-endpoint=grpc://otel-collector:4317
      - --collect-detailed-traces=all
    environment: &vllm-env
      OTEL_SERVICE_NAME: vllm-gemma
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [hf-cache:/root/.cache/huggingface]
    ipc: host
    networks:
      default:
        aliases: [vllm-gemma]
    deploy: &gpu
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  vllm-embed-gpu:
    profiles: [gpu]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    entrypoint: ["vllm", "serve"]
    command:
      - ${VLLM_EMBED_MODEL:-intfloat/multilingual-e5-small}
      - --served-model-name=harrier
      - --port=8000
      - --gpu-memory-utilization=0.1
    environment:
      <<: *vllm-env
      OTEL_SERVICE_NAME: vllm-embed
    volumes: [hf-cache:/root/.cache/huggingface]
    networks:
      default:
        aliases: [vllm-embed]
    deploy: *gpu

  dcgm-exporter:
    profiles: [gpu]
    image: ${DCGM_IMAGE:-nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.3-ubuntu22.04}
    cap_add: [SYS_ADMIN]
    deploy: *gpu

  postgres:                    # app-databasen (konversationer, affärsdata)
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes: [pg-data:/var/lib/postgresql/data]

  paradedb:                    # RAG-databasen: Postgres + pg_search (BM25) + pgvector
    image: paradedb/paradedb:0.25.10-pg18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: rag
    volumes: [paradedb-data:/var/lib/postgresql]

  # -------------------------------------------------------- INFRA-EXPORTERS --
  node-exporter:
    image: prom/node-exporter:v1.10.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    devices: ["/dev/kmsg"]
    command: ["--docker_only=true", "--housekeeping_interval=10s", "--store_container_labels=false",
              "--whitelisted_container_labels=com.docker.compose.service"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # ---------------------------------------------------------- OBSERVABILITY --
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      TRACE_SAMPLING_PERCENT: ${TRACE_SAMPLING_PERCENT:-100}
    ports:
      - "4317:4317"   # OTLP gRPC  – exponerad så att externa team/tjänster kan pusha hit
      - "4318:4318"   # OTLP HTTP  – även för browser-SDK
    depends_on: [loki, tempo, prometheus]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-otlp-receiver          # PUSH: OTLP-metrics från Collectorn
      - --web.enable-remote-write-receiver  # PUSH: RED/service graph från Tempo
      - --enable-feature=exemplar-storage   # exemplars -> länk till trace
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    user: "0"
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.2
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"   # för arkitekturkartorna (SVG i text-paneler)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/00-start.json
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]

volumes:
  pg-data:
  paradedb-data:
  prom-data:
  loki-data:
  tempo-data:
  hf-cache:
