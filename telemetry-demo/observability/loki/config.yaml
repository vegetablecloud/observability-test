# Loki i single-binary-läge med filsystem som lagring (räcker för demo/en maskin).
# Loggar tas emot via OTLP på /otlp/v1/logs (från Collectorn).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true   # trace_id, span_id, severity m.m. lagras här – INTE som index-labels
  volume_enabled: true
  retention_period: 72h
  # Vilka OTLP resource-attribut som blir index-labels. service.name -> service_name
  # finns med som default. Lägg INTE till högkardinala attribut här.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [deployment.environment.name]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true
