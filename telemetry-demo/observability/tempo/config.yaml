# Tempo i monolitiskt läge. Tar emot traces via OTLP från Collectorn och
# genererar metrics ur dem (metrics-generator) som skrivs till Prometheus:
#   * service-graphs -> traces_service_graph_*   (service graph i Grafana)
#   * span-metrics   -> traces_spanmetrics_*     (RED: rate, errors, duration)
#   * local-blocks   -> TraceQL metrics-frågor   ({ } | rate() i Explore)
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      # Spans mot tjänster som inte själva skickar traces (qdrant, llm, postgres)
      # blir "virtuella noder" via de här attributen.
      peer_attributes: [peer.service, server.address, db.name, db.system]
      dimensions: []
    span_metrics:
      dimensions: []
      # Håll dimensionerna få – varje ny dimension multiplicerar antalet serier.

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
